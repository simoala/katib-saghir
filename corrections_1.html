<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تصحيح كراسة المسار الثالث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: a corrected school notebook — lesson tabs, then summary, vocab table, exercises with the teacher's green answers revealed on demand */
:root{
  --paper:#f7f9fc; --sheet:#ffffff; --ink:#1d2b4a; --ink-soft:#5b6785; --line:#dfe5ef;
  --blue:#2457a6; --blue-bg:#e8effa; --pen:#c62f3a; --pen-bg:#fdecee; --ok:#23784a; --ok-bg:#e4f3ea;
  --amber:#a8690b; --amber-bg:#fdf3e1;
  --display:"Reem Kufi","Noto Naskh Arabic",Tahoma,sans-serif;
  --body:"Noto Naskh Arabic","Traditional Arabic",Tahoma,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161f; --sheet:#182030; --ink:#e7ecf6; --ink-soft:#a3aec4; --line:#2a3447;
  --blue:#8fb4f0; --blue-bg:#1d2a44; --pen:#ff8a92; --pen-bg:#3a1f25; --ok:#6fcf97; --ok-bg:#183326;
  --amber:#f0b45a; --amber-bg:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161f; --sheet:#182030; --ink:#e7ecf6; --ink-soft:#a3aec4; --line:#2a3447;
  --blue:#8fb4f0; --blue-bg:#1d2a44; --pen:#ff8a92; --pen-bg:#3a1f25; --ok:#6fcf97; --ok-bg:#183326;
  --amber:#f0b45a; --amber-bg:#3a2c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.85;direction:rtl}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
h1{font-family:var(--display);font-size:clamp(24px,5vw,34px);margin:0;color:var(--blue);line-height:1.3;text-wrap:balance}
h1 span{color:var(--ok)}
.sub{margin:0;color:var(--ink-soft);font-size:15px}
h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:18px;color:var(--blue);display:flex;align-items:center;gap:8px}
h3 .n{font-size:13px;background:var(--blue);color:var(--sheet);border-radius:999px;min-width:24px;text-align:center;line-height:24px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font:600 15px var(--body);cursor:pointer;color:var(--ink)}
.toggle[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 15px var(--body);cursor:pointer;display:flex;gap:8px;align-items:center}
.chip b{font-family:var(--display);color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.chip[aria-pressed="true"] b{color:var(--sheet)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px}
.tag{background:var(--blue-bg);color:var(--blue);border-radius:6px;padding:1px 10px}
.src{font-size:13.5px;color:var(--ink-soft);margin:0}
.sum{margin:0;font-size:17.5px}
.note{margin:0;font-size:14px;color:var(--ink-soft)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{border:1px solid var(--line);padding:6px 12px;text-align:right;vertical-align:top}
th{background:var(--blue-bg);color:var(--blue);font-family:var(--display);font-weight:500}
td.k{font-weight:700;white-space:nowrap;width:1%}
.ans{color:var(--ok);font-weight:600}
.hid .ans-v{filter:blur(6px);user-select:none;cursor:pointer}
.q{margin:0;font-weight:700}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.opt{width:100%;text-align:right;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:7px 12px;font:400 16px/1.6 var(--body);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt .box{flex:0 0 22px;height:22px;border:1.5px solid var(--ink-soft);border-radius:5px;display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:2px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .box{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--pen);background:var(--pen-bg)} .opt.wrong .box{background:var(--pen);border-color:var(--pen);color:#fff}
.why{margin:0;font-size:15px;color:var(--ink-soft);border-inline-start:3px solid var(--ok);padding-inline-start:10px}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details+details{margin-top:0}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary::after{content:"أظهر الجواب";margin-inline-start:auto;flex:0 0 auto;font:600 13px var(--body);color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:1px 10px}
details[open] summary::after{content:"أخفِ الجواب"}
details p{margin:8px 0 0;color:var(--ok);font-size:16.5px}
.model{white-space:pre-line;margin:0;font-size:17.5px;line-height:2;background:var(--ok-bg);border-radius:10px;padding:14px 16px}
.model::first-line{font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.score{font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.nav{display:flex;justify-content:space-between;gap:10px}
.btn{border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:10px;padding:8px 16px;font:600 15px var(--body);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1>تصحيح كراسة <span>المسار الثالث</span></h1>
      <p class="sub">المستوى السادس · دعم التعلمات الأساس · النصوص والتمارين مع الأجوبة ونماذج الإنتاج الكتابي</p>
      <p class="sub"><a href="index.html" style="color:var(--blue);font-weight:700">← ورشة الكاتب الصغير (أكتب وأصحّح)</a></p>
    </div>
    <button class="toggle" id="teacher" type="button" aria-pressed="false">وضع الأستاذ: إظهار كل الأجوبة</button>
  </header>
  <nav class="picker" id="picker" aria-label="اختر الدرس"></nav>
  <main id="lesson" class="list"></main>
  <div class="nav"><button class="btn" id="prev" type="button">→ الدرس السابق</button><button class="btn" id="next" type="button">الدرس التالي ←</button></div>

<script>
const LESSONS = [
{ t:'حذاء الطنبوري', s:'الحصتان 1 و 2', src:'كامل كيلاني، «حذاء الطنبوري»، بتصرف',
  sum:'أبو القاسم الطنبوري تاجر غني بخيل، ظلّ سنوات يرقّع حذاءه القديم بدل أن يشتري جديدًا. كلما حاول التخلص منه (في الحمّام، في النهر، من النافذة، بالدفن ليلًا) عاد إليه الحذاء ومعه غرامة أو مصيبة جديدة. في النهاية تبرّأ منه أمام القاضي، وخرج حافيًا فاشترى حذاءً جديدًا دون مساومة، واشترى حذاءً لصبيّ حافٍ.',
  vocab:{q:'أستعين بسياق الكلمة لأصل إلى معناها', rows:[['رقع','قطع جلد يُخاط بها الحذاء الممزّق ليُصلَح'],['غرامة','مال يُدفع عقوبةً على خطأ أو ضرر'],['أزقّة','جمع زُقاق: طرق ضيّقة بين البيوت'],['وَجِلًا','خائفًا مضطربًا']]},
  mcq:[{q:'أ- لماذا لم يشترِ الطنبوري حذاءً جديدًا؟',o:['لأنه لم يجد حذاءً يناسبه.','لأنه كان شديد التعلّق بماله.','لأنه كان ينتظر هدية.','لأنه لم يكن يملك المال.'],c:1,w:'النص يقول: «كان شديد التعلّق بماله، لا يُنفق منه إلا قليلًا»، وهو تاجر غني.'},
       {q:'ب- ماذا ظنّ الطنبوري عندما رأى الحذاء الجديد؟',o:['ظنّ أن القاضي نسيه.','ظنّ أن حذاءه القديم قد أُصلح.','ظنّ أن الصيّاد تركه.','ظنّ أن أحد أصدقائه أهداه إليه.'],c:3,w:'«فظنّ أن أحد أصدقائه قد أهداه إليه، فلبسه ومضى فرحًا».'}],
  open:[['ج- لماذا قال الراوي عن الحذاء: «كأنه لا يريد أن يفارقه»؟','لأن الحذاء كان يعود إلى الطنبوري بعد كل محاولة للتخلص منه: أعاده القاضي، وأخرجه الصيّاد من النهر وردّه إليه، وكشفه الجيران حين حاول دفنه؛ فبدا كأنه متمسّك بصاحبه لا يريد فراقه.'],
        ['3. ما التغيّر الذي طرأ على سلوك الطنبوري في نهاية الحكاية؟','تحوّل من البخل إلى الكرم: اشترى حذاءً جديدًا ودفع ثمنه «من غير مساومة طويلة»، ثم عاد إلى البائع وهمس في أذنه، فإذا بالصبي الحافي يركض نحوه بحذاء جديد ويلوّح له شاكرًا؛ أي أنه اشترى للصبي حذاءً أيضًا.'],
        ['4. لماذا توقف الطنبوري وجلًا عندما سمع وقع الحذاء؟ وماذا يكشف ذلك عنه؟','ظنّ أن حذاءه القديم عاد يركض خلفه ليجلب له مصيبة جديدة. ويكشف ذلك عن الخوف والقلق اللذين تركتهما المصائب المتتالية في نفسه.'],
        ['5. هل الحذاء هو سبب المصائب، أم أن قرارات الطنبوري أسهمت فيها؟ (رأي معلّل)','الحذاء ليس السبب الحقيقي، بل قرارات الطنبوري: بخله الذي جعله يحتفظ بحذاء بالٍ، ثم تصرفاته المتسرّعة؛ فقد لبس حذاءً ليس له، ورمى حذاءه في النهر، وألقاه من النافذة، وحاول دفنه ليلًا دون أن يفكر في العواقب. (يُقبل كل رأي معلّل بأمثلة من النص.)']],
  model:'أنا حذاءُ الطنبوري، ذلك التاجر الغني البخيل. منذ سنوات طويلة وصاحبي يرقّعني بدل أن يشتري حذاءً جديدًا، حتى صرتُ ثقيلًا قبيحًا يعرفني كلّ أهل بغداد. وذات يوم تركني عند باب الحمّام، فظنّ الناس أنه سرق حذاء القاضي، فدفع غرامة كبيرة بسببي. بعد ذلك رماني في النهر غاضبًا، فعلقتُ في شبكة صيّاد أعادني إليه. ثم ألقاني من نافذته، فسقطتُ على قوارير عطر ثمينة فتكسّرت. وحين حاول دفني ليلًا، ظنّه الجيران لصًّا فاشتكوه. كنتُ أشعر بالحزن والخجل، فأنا لم أُرِد إيذاءه، بل كنت أتمنّى أن يرحمني من الترقيع. وفي النهاية حملني إلى القاضي وتبرّأ منّي. لا ألومه على فراقي بقدر ما ألومه على بخله؛ فلو أنفق قليلًا من ماله في وقته، لما خسر الكثير بعد ذلك.'},

{ t:'الذئب ودونغ قو', s:'الحصتان 3 و 4', src:'أسطورة صينية قديمة، من المجموعة القصصية «بائع التبغ»، بتصرف',
  sum:'العالِم دونغ قو يسافر بكتبه على حماره، فيستغيث به ذئب جريح يطارده الصيادون. يتردد ثم يُخفيه في كيس الكتب ويضلّل الصيادين. بعد النجاة يريد الذئب أكله، فيتفقان على الاحتكام إلى ثلاثة: الشجرة والثور يحكمان للذئب لِما لقياه من جحود الإنسان، أما الفلاح فيطلب أن يُعاد المشهد ليفهم، فيدخل الذئب الكيس ويُربط، فيضربه الفلاح بعصاه. ويدرك دونغ قو أن الرحمة لا تعني الغفلة عن الخطر.',
  vocab:{q:'أبحث عن أضداد الكلمات في النص، وأحدد نوعها', head:['الكلمة','ضدّها','نوعها'], rows:[['القاسي','الرحيم','اسم (صفة)'],['هلكتَ','نجوتَ','فعل'],['الإساءة','الإحسان','اسم (مصدر)'],['متواضعًا','متكبّرًا','اسم (صفة)']]},
  mcq:[{q:'أ- لماذا قرّر دونغ قو إخفاء الذئب؟',o:['لأنه أراد الاحتفاظ به.','لأنه رقّ لحاله وصدّق وعده.','لأنه خاف من الصيادين.','لأنه أراد أن يبحث عن طعام له.'],c:1,w:'رقّ قلب دونغ قو لحال الذئب الجريح، وصدّق وعده بألّا ينسى جميله.'},
       {q:'ب- ماذا يكشف تردّد دونغ قو ثم مساعدته للذئب عن شخصيته؟',o:['أنه لم يكن يعرف خطر الذئاب.','أنه كان واثقًا تمامًا من وفاء الذئب.','أنه كان يريد خداع الصيادين.','أنه كان مترددًا بين الحذر والرحمة، فغلبت رحمته حذره.'],c:3,w:'تردّد لأنه يعرف أن الذئب لا يُؤمَن جانبه، لكن رحمته غلبت حذره.'}],
  open:[['ج- قارن بين وعد الذئب قبل إنقاذه وسلوكه بعد نجاته. ماذا تستنتج؟','قبل الإنقاذ وعد بأنه لن ينسى جميل دونغ قو أبدًا، وبعد النجاة أراد أن يأكله متذرّعًا بالجوع. نستنتج أن الذئب ناكر للجميل غدّار، وأن وعود من هو في ضيق قد لا تكون صادقة.'],
        ['3. هل تُثبت تجربة الشجرة والثور أن من حق الذئب أن يفترس دونغ قو؟','لا تُثبت ذلك؛ فالشجرة والثور يحكيان جحود أصحابهما لهما، وهذا ظلم لا يبرّر ظلمًا آخر. ودونغ قو أحسن إلى الذئب شخصيًا وأنقذه، فلا يُكافأ الإحسان بالإساءة.'],
        ['4. لو كنت مكان دونغ قو، هل كنت ستساعد الذئب بالطريقة نفسها؟','(جواب شخصي) مثال: كنت سأساعده لأن الرحمة خُلق نبيل، لكن بحذر: أُبقيه مقيّدًا في الكيس حتى أبتعد عنه، ثم أطلقه في مكان آمن لي.'],
        ['5. لماذا جعل الراوي دونغ قو والذئب يحتكمان إلى الشجرة والثور قبل الفلاح؟ وما أثر هذا الترتيب؟','ليزداد التوتر والتشويق: فالحكمان الأوّلان في صالح الذئب، فيقترب الخطر من دونغ قو، ثم يأتي الفلاح الذكي في النهاية بالحل. وأثر هذا الترتيب أنه يُبرز قيمة الحكمة والتفكير الهادئ.']],
  model:'تبدأ القضية حين أنقذ العالِم دونغ قو ذئبًا جريحًا من الصيادين، فأخفاه في كيس كتبه، فلمّا نجا الذئب أراد أن يأكله. واحتكما إلى الشجرة والثور، فحكما للذئب لأنهما ذاقا جحود الإنسان، بينما احتال الفلاح الذكي فطلب إعادة المشهد، فدخل الذئب الكيس ورُبط. في رأيي، أخطأ دونغ قو حين صدّق وعد الذئب دون حذر، لأنه يعرف طبع الذئاب، لكنّ رحمته في ذاتها خُلق نبيل. أما الذئب فهو ناكر للجميل؛ ممّا يدلّ على أن الإساءة جزاء من يُحسن إلى من لا يستحق دون تبصّر. وفي المقابل، كان الفلاح نموذج العقل الذي ينقذ الموقف. ونخرج من هذه الحكاية بحكمة بالغة: كن رحيمًا بعقل يقظ، فالرحمة بلا بصيرة سذاجة قد تقود صاحبها إلى الهلاك.'},

{ t:'المقامة الحِرزية', s:'الحصتان 5 و 6', src:'بديع الزمان الهمذاني، «المقامة الحرزية»، بتصرف',
  sum:'يحكي عيسى بن هشام أنه ركب البحر، فهبّت عاصفة واشتدّ الخوف. رأى رجلًا هادئًا ادّعى أن معه حِرزًا من حمله لم يغرق، فتهافت الركاب عليه، وقبل أن يعطي كلًّا منهم حرزًا مقابل دينار الآن ودينار عند الوصول. هدأ البحر فنجوا، فجمع الرجل الدنانير، واعترف بأنه لم يكن يعلم الغيب، لكنه صبر وانتظر حين جزعوا هم.',
  vocab:{q:'أستعين بسياق الكلمة لأصل إلى معناها', rows:[['سُدوله','ستائره، أي ظلامه'],['الوَجَل','الخوف'],['حِرز','ما يُعتقد أنه يحفظ صاحبه من الخطر (تميمة)'],['تِبْرًا','ذهبًا']]},
  mcq:[{q:'أ- ماذا ادّعى صاحب الحرز؟',o:['أنه يعرف متى تهدأ العاصفة.','أنّ من حمل الحرز لم يغرق وسلم من الهلاك.','أنه يستطيع قيادة السفينة.','أنه يملك طعامًا ودواءً للركاب.'],c:1,w:'«معي حرز، من حمله لم يغرق، ومن حفظه من الهلاك سلم».'},
       {q:'ب- لماذا لم يساوم الركابُ الرجلَ ولم يجادلوه؟',o:['لأنهم وثقوا به منذ بداية الرحلة.','لأن الرجل رفض التفاوض.','لأنهم عرفوا أن الحرز مجرَّب.','لأن الخوف أضعف قدرتهم على التفكير.'],c:3,w:'«وكان الخوف قد أغلق باب التفكير، وفتح باب التصديق».'}],
  open:[['ج- ماذا يقصد الراوي بقوله: «وتعلّقت به القلوب قبل الأيدي»؟','يقصد أن الركاب صدّقوا الرجل وتمسّكوا بأمل النجاة الذي وعدهم به بقلوبهم قبل أن تمتدّ أيديهم إلى الحرز؛ فقد كان رجاؤهم شديدًا.'],
        ['3. كيف أثّر الخوف في طريقة تفكير الركاب وقراراتهم؟','أغلق الخوف باب التفكير وفتح باب التصديق: لم يساوم أحد ولم يجادل، وأخرج كلّ راكب ديناره يرجو النجاة ويخشى الوفاة، وصدّقوا ادعاءً لا دليل عليه.'],
        ['4. هل نجا الركاب بفضل الحرز؟ ما القرينة؟','لا. نجوا لأن العاصفة انتهت: «حتى خفّت الريح، وهدأت الأمواج، وانقشعت السحب». والرجل نفسه اعترف: «حملتُ من الحرز مثل ما حملتم، وما علمتُ من الغيب أكثر مما علمتم».'],
        ['5. كيف تقوّم سلوك صاحب الحرز: صابرًا حسن التدبير أم مستغلًّا لخوف الركاب؟','(رأي معلّل) هو مستغلّ قبل كل شيء: استعمل خوف الناس ليأخذ أموالهم بحيلة وكذب. صحيح أنه كان هادئًا صابرًا، لكن الصبر فضيلة إذا لم يُستعمل للخداع.']],
  model:'خرجنا في رحلة مدرسية إلى الجبل، وكانت السماء صافية والطريق آمنًا. فلما وصلنا القمة، تلبّدت الغيوم، واشتدّت الريح، وضاع منّا الطريق. هذا يبكي، وذاك يصرخ، وثالث يجري بلا هدف. وبينما نحن بين خوف ورجاء، تقدّم رجل غريب وقال بثقة: «معي خريطة سحرية، من اتّبعها لم يضلّ». فسألناه: «وما ثمنها؟» قال: «درهم الآن، ودرهم إذا وصلتم». فأعطيناه دراهمنا مسرعين، وسرنا خلفه ساعة. ثم انقشع الضباب، فإذا الحافلة أمامنا على بُعد خطوات، وإذا الخريطة ورقة بيضاء! ضحك الرجل وقال: «ما عرفتُ الطريق أكثر مما عرفتم، لكنكم خفتم فصدّقتم، وصبرتُ فربحت». فعرفنا أن الخوف يُعمي العقل، وأن الهدوء أنفع من كل خريطة.'},

{ t:'النحل: المهندس الصغير', s:'الحصتان 7 و 8', src:'كامل كيلاني، «النحلة العاملة»، بتصرف',
  sum:'يصف النص الخلية عالمًا منظمًا: أقراص شمعية سداسية متراصّة، وملكة واحدة تضع البيض، وعاملات تنتقل بين أعمال مختلفة حسب مراحل حياتها. تتواصل النحلات بالحركات والروائح، فتدلّ الكاشفة زميلاتها على مصدر الرحيق. ويُلقّح النحل النباتات، ويحافظ على حرارة الخلية بأجنحته وأجسامه. ولا توجد نحلة تُصدر الأوامر، بل ينشأ النظام من استجابة كل عاملة لما حولها.',
  vocab:{q:'أستعين بسياق النص لأصل إلى معنى الكلمات', rows:[['تتراصّ','تتلاصق وتنتظم دون فراغات بينها'],['حَوْصلة','جزء خاص في جسم النحلة تجمع فيه الرحيق'],['تشُحّ','تقلّ'],['تآلُف','اجتماع وانسجام']]},
  mcq:[{q:'أ- لماذا يُعدّ الشكل السداسي مناسبًا لبناء العيون الشمعية؟',o:['لأنه يجعل العيون أكبر حجمًا.','لأنه يتراصّ ويتيح التخزين بقدر مناسب من الشمع.','لأنه يساعد النحل على الطيران.','لأنه يسهّل دخول الضوء إلى الخلية.'],c:1,w:'«يتراصّ هذا الشكل من غير فراغات بين العيون، ويتيح تخزين كمية كبيرة… بقدر مناسب من الشمع».'}],
  open:[['ب- كيف تنقل النحلة الكاشفة معلومة مكان الرحيق إلى زميلاتها؟','تعود إلى الخلية وتؤدّي حركات خاصة فوق القرص الشمعي؛ فاتجاه الحركة ومدّتها يدلّان على جهة الزهور وبعدها، وتُكمل الرائحة التي تحملها المعلومة.'],
        ['ج- ماذا يمكن أن يحدث للخلية إذا تعطّل عمل النحلات التي تنظّم الحرارة؟','تختلّ حرارة الخلية: إذا ارتفعت لا يجد أحد من يحرّك الأجنحة لتبريد الهواء، وإذا اشتدّ البرد لا يجد أحد من يتجمّع حول الحضانة لتدفئتها؛ فتهلك اليرقات ويفسد الغذاء، لأن الخلية تحتاج درجة حرارة مناسبة.'],
        ['د- «لم تكن هناك نحلة تُصدر الأوامر للجميع». كيف ينشأ إذن نظام الخلية الدقيق؟','ينشأ من استجابة كل عاملة لما حولها من روائح وحركات وحاجات، ومن تآلف هذه الاستجابات؛ فكل نحلة تأخذ مكانها وتنتقل بين الأعمال حسب مرحلة حياتها، فيتكامل العمل دون قائد يأمر.'],
        ['3. ماذا يكشف دور النحل في تلقيح النباتات عن العلاقة بين الخلية والبيئة؟','يكشف علاقة تبادل ومنفعة: يأخذ النحل الرحيق وحبوب اللقاح غذاءً لخليته، وفي الوقت نفسه ينقل حبوب اللقاح من زهرة إلى أخرى، فيساعد النباتات على تكوين الثمار والبذور، وتمتدّ فائدته إلى الحقول والبساتين.'],
        ['4. ماذا يمكن أن يحدث للخلية إذا اختلّ التواصل بين النحلات؟','تضطرب الأعمال: لا تعرف العاملات أماكن الرحيق فيقلّ الغذاء، ولا تتحرك الجماعة حين تحتاج الخلية إلى تبريد أو تدفئة، فتضعف الخلية كلها؛ لأن نظامها قائم على الإشارات (الحركات والروائح).'],
        ['5. أيّهما أدقّ في وصف قوة الخلية: كثرة النحلات أم تكامل أدوارها؟','تكامل الأدوار أدقّ؛ فالكثرة وحدها لا تصنع نظامًا. الأدلة: «كلّ نحلة تأخذ مكانها في نظام تتكامل فيه الأدوار»، والعاملة تنتقل بين الأعمال حسب مراحل حياتها، والنص يختم بـ«حسن توزيع الأدوار وقوة العمل الجماعي».']],
  model:'قد تظنّ أن في الخلية نحلة تأمر الجميع، لكنّ الحقيقة غير ذلك؛ فنظام الخلية ينشأ من تعاون آلاف النحلات. تتوزّع الأدوار بينها: الملكة تضع البيض، والعاملات تنتقل بين أعمال مختلفة حسب أعمارها، فتنظّف العيون، ثم تطعم اليرقات، ثم تبني بالشمع، ثم تحرس المدخل وتجمع الرحيق. وتتواصل النحلات بالحركات والروائح؛ فحين تجد الكاشفة زهورًا، ترقص فوق القرص فتدلّ زميلاتها على جهتها وبعدها. وإذا ارتفعت الحرارة حرّكت العاملات أجنحتها لتبريد الهواء، وإذا اشتدّ البرد تجمّعت حول الحضانة. وهكذا تستجيب كلّ نحلة لما حولها، ومن تآلف هذه الاستجابات يولد نظام دقيق دون قائد يأمر.'},

{ t:'رحلة قطرة ماء', s:'الحصتان 9 و 10', src:'جون فيني، «الماء: مقدمة قصيرة جدًّا»، بتصرف',
  sum:'قطرة ماء تحكي رحلتها: تمتصّ طاقة الشمس على سطح المحيط فتتبخر، وتتكاثف في الهواء البارد حول ذرّات الغبار مكوّنةً سحابة، ثم تسقط مطرًا حين تثقل. تتسرّب في التربة وتمتصّها جذور شجرة، ثم تخرج من الورقة بخارًا بالنتح. وتسلك قطرات أخرى مسارات مختلفة: أنهار، وجليد، ومياه جوفية. فدورة الماء شبكة واسعة تربط البحر والهواء واليابسة والكائنات الحيّة.',
  vocab:{q:'أعرّف كل عملية بما يدلّ عليها في النص', rows:[['التبخّر','تحوّل الماء إلى بخار يرتفع في الهواء بفعل طاقة الشمس'],['التكاثف','تجمّع جزيئات البخار حول ذرات الغبار في الهواء البارد لتصير قطرات'],['التسرّب','نفاذ الماء عبر حبيبات التربة إلى باطن الأرض'],['النتح','خروج الماء بخارًا من فتحات دقيقة في أوراق النبات']]},
  mcq:[{q:'أ- ماذا حدث للقطرة عندما امتصّ الماء طاقة الشمس؟',o:['تجمّدت فوق سطح المحيط.','تحوّلت إلى بخار وارتفعت في الهواء.','تسرّبت إلى باطن الأرض.','تحوّلت إلى ملح.'],c:1,w:'«فامتصّ الماء جزءًا من طاقتها… حتى استطعتُ الإفلات… وصرتُ بخارًا».'}],
  open:[['ب- لماذا سقطت القطرة من السحابة مطرًا؟','لأنها اندمجت مع قطرات أخرى فكبرت وثقلت، فعجزت التيارات الهوائية عن حملها.'],
        ['ج- لم تسلك قطرات المطر كلّها المسار نفسه. اذكر مسارين مختلفين وردا في النص.','مثلًا: قطرات تسرّبت بين حبيبات التربة وصارت ماءً جوفيًّا يخرج من عين أو بئر، وقطرات استقرّت على أوراق الأشجار ثم عادت إلى الهواء بخارًا. (ويُقبل أيضًا: الجريان في الأنهار حتى المحيطات، أو التجمّد فوق القمم.)'],
        ['3. كيف أثّر تغيّر درجة الحرارة في مراحل رحلة القطرة؟ (مثالان)','ارتفاع الحرارة: دفّأت الشمس ماء المحيط فتبخّرت القطرة. انخفاض الحرارة: كلما ارتفعت القطرة برد الهواء فلم يعد قادرًا على حمل البخار، فتكاثفت وصارت قطرة سائلة. (وفي القمم الباردة يتجمّد الماء.)'],
        ['4. ما الذي يُثبت أن دورة الماء ليست مسارًا واحدًا ثابتًا؟','أن القطرات تسلك طرقًا مختلفة: بعضها يتسرّب إلى باطن الأرض، وبعضها يجري في الأنهار، وبعضها يتجمّد سنوات، وبعضها يدخل جسم إنسان أو حيوان؛ كما أن مدّتها تختلف بين ساعة واحدة وسنوات طويلة.'],
        ['5. كيف يُبيّن مسار القطرة أن الماء يربط بين البحر والهواء واليابسة والكائنات الحيّة؟','انطلقت القطرة من البحر، ثم صارت بخارًا في الهواء، ثم سقطت مطرًا على اليابسة وتسرّبت في التربة، ثم امتصّتها شجرة (كائن حي)، ثم عادت إلى الهواء بالنتح. فهي تنتقل بين هذه العناصر كلها وتصلها ببعضها.']],
  model:'دورة الماء هي الرحلة التي يقطعها الماء باستمرار بين البحر والهواء واليابسة والكائنات الحية. تبدأ حين تُسخّن الشمس سطح البحار، فيتبخّر جزء من الماء ويرتفع في الهواء. وكلما صعد البخار برد الهواء، فيتكاثف حول ذرات الغبار مكوّنًا قطرات صغيرة تتجمّع في السحب. وعندما تكبر القطرات وتثقل، تسقط مطرًا على الأرض. بعد ذلك تتنوّع المسارات: بعض الماء يتسرّب إلى باطن الأرض، وبعضه يجري في الأنهار نحو البحر، وبعضه تمتصّه جذور النباتات ثم يخرج من أوراقها بخارًا بالنتح، وبعضه يتجمّد فوق القمم. وهكذا يعود الماء دائمًا إلى نقطة البداية، فتستمرّ الدورة وتستمرّ معها الحياة.'},

{ t:'لغز الأخطبوط', s:'الحصتان 11 و 12', src:'فيليب ملاديونوف، «علم الأحياء البحرية: مقدمة قصيرة جدًّا»، بتصرف',
  sum:'باحث يضع سرطانًا في وعاء زجاجي مغلق، فيفتحه الأخطبوط بتثبيته وإدارة غطائه بأذرعه. أذرعه الثماني مرنة، مزوّدة بممصّات حساسة وخلايا عصبية كثيرة، وجسمه بلا هيكل عظمي فينساب في الشقوق. يدافع عن نفسه بتغيير لونه وملمسه، ونفث الحبر، والاندفاع بالماء. ويستعمل قشور جوز الهند ملجأً، ويتعلّم من خبرته، وتختلف طباع الأخاطب؛ فيكرّر العلماء التجارب قبل الحكم.',
  vocab:{q:'أستثمر النص لإكمال خريطة مفهوم «الذكاء عند الحيوان»', head:['الركن','الجواب'], rows:[['التعريف كما أفهمه من النص','قدرة الحيوان على حلّ مشكلات جديدة، والتعلّم من الخبرة، وتغيير سلوكه حين يفشل'],['مؤشّراته','ابتكار الحلول، واستعمال الأدوات، والتعلّم من التجارب، والمرونة في السلوك'],['مثال دالّ من النص','فتح الوعاء الزجاجي المغلق، أو حمل أنصاف قشور جوز الهند واستعمالها ملجأً'],['مثال غير دالّ','التنفّس أو الانسياب بين الصخور (خاصية جسمية وليست تفكيرًا)']]},
  mcq:[{q:'أ- كيف استطاع الأخطبوط فتح الوعاء الزجاجي المغلق؟',o:['بكسر جدار الوعاء بمنقاره الصلب الحادّ.','بالانتظار حتى تحرّك السرطان ودفع الغطاء من الداخل.','بقذف سحابة الحبر حتى تآكل الغطاء.','بتثبيت الوعاء ببعض أذرعه وإدارة الغطاء وسحبه بذراع أخرى.'],c:3,w:'«ثبّت الأخطبوط الوعاء ببعض أذرعه، وأخذ يدير الغطاء… حتى انفتح».'},
       {q:'ب- ماذا يكشف سلوكه في حمل قشور جوز الهند واستعمالها ملجأً؟',o:['قدرته على ابتكار حلول وتوظيف أدوات من بيئته لحماية نفسه.','أنه يفضّل النباتات البحرية والثمار.','عدم قدرة ممصّاته على الالتصاق بالصخور.','رغبته في لفت انتباه الباحثين.'],c:0,w:'النص يقول إن هذا السلوك يُظهر قدرته على الانتفاع بأشياء من بيئته للحماية.'}],
  open:[['ج- ما العلاقة بين خلوّ جسم الأخطبوط من هيكل عظمي صلب، وقدرته على النجاة من المفترسات؟','لأن جسمه بلا هيكل عظمي، فهو مرن جدًّا ينساب في شقوق ضيّقة بين الصخور يصعب على المفترسات بلوغها؛ فيختبئ فيها وينجو. (أكبر جزء صلب فيه منقاره.)'],
        ['3. هل يكفي نجاح الأخطبوط في فتح الوعاء وحده للحكم عليه بالذكاء؟','لا يكفي؛ فتجربة واحدة قد تكون صدفة. الذكاء يظهر في مجموع سلوكه: تكرار المحاولة، واستعمال الأدوات (القشور)، والتعلّم من الخبرة، وتغيير السلوك حين يفشل.'],
        ['4. اختلاف طباع الأخاطب دفع العلماء إلى تكرار التجارب وتجنّب الأحكام السريعة. ما رأيك؟ وما الذي نتعلّمه؟','سلوك علمي سليم، لأن الحكم على كائن من تجربة واحدة قد يخطئ. ونتعلّم منه في حياتنا: التثبّت قبل الحكم على الأشياء والناس، والصبر، وتكرار المحاولة.'],
        ['5. كيف تتكامل وسائله الدفاعية الثلاث (التمويه، نفث الحبر، الدفع النفاث) لتجعله من أبرع الكائنات في التخفّي؟','تعمل على مراحل: أولًا يتخفّى بتغيير لونه وملمسه حتى لا يُرى، فإن اقترب المفترس نفث سحابة حبر تحجب الرؤية وتربكه، ثم يندفع بالماء بقوة هاربًا ليختبئ في شقّ. فإذا فشلت وسيلة جاءت التالية.']],
  model:'عبقرية الأخطبوط: كائن بحري يسبق الخيال\nهل تصدّق أن حيوانًا بحريًّا يستطيع فتح وعاء مغلق؟ هذا ما فعله الأخطبوط حين ثبّت الوعاء ببعض أذرعه وأدار الغطاء بذراع أخرى. ويعود ذلك إلى أذرعه الثماني المرنة المزوّدة بممصّات حسّاسة وخلايا عصبية كثيرة، تتعرّف الأشياء بالّلمس. ويتعلّم الأخطبوط من خبرته، فيغيّر سلوكه إذا فشل، بل يستعمل قشور جوز الهند ملجأً يحتمي به. وحين يشعر بالخطر، يغيّر لونه وملمسه ليتخفّى، أو ينفث سحابة حبر تحجبه، ثم يندفع هاربًا بقوة الماء. إن هذا الكائن العجيب كنز من كنوز البحر، لذا علينا أن نحميه ونحمي أمثاله من الصيد الجائر ورمي النفايات في البحار؛ فالبحر النظيف حياة لنا جميعًا.'},

{ t:'قرية الملح في قلب الصحراء', s:'الحصتان 13 و 14', src:'ابن بطوطة، «تحفة النظار في غرائب الأمصار وعجائب الأسفار»، بتصرف',
  sum:'خرج ابن بطوطة مع قافلة من سجلماسة نحو بلاد السودان، فوصل بعد خمسة وعشرين يومًا إلى تغازى، قرية قاحلة بيوتها من ألواح الملح وسقفها من جلود الجمال. يستخرج العمال الملح من باطن الأرض، وتأتيهم المؤن من سجلماسة ودرعة. أقام فيها عشرة أيام لشدّة الصحراء أمامهم. والملح يُباع في السودان بأضعاف ثمنه، ويُتعامل به كالذهب والفضة؛ فصارت تغازى حلقة في طريق تجاري يصل شمال الصحراء بجنوبها.',
  vocab:{q:'أستخرج من النص أربع كلمات تنتمي إلى شبكة مفردات «القافلة»', rows:[['1','الجِمال'],['2','التجّار'],['3','الأحمال'],['4','الرحيل']], note:'يُقبل أيضًا: المسافرون، السِّلَع، الأمتعة، الطريق.'},
  mcq:[{q:'أ- لماذا اضطرّ ابن بطوطة ورفاقه للمكوث عشرة أيام في تغازى؟',o:['لانتظار هطول الأمطار وانكسار حرارة الصيف.','لتعلّم كيفية حفر مناجم الملح وبناء البيوت منه.','لأنهم ضلّوا الطريق وانتظروا دليلًا جديدًا.','للتزوّد بالماء وإعداد الأحمال قبل دخول الصحراء المخوفة التي يندر فيها الماء.'],c:3,w:'«كان عليهم أن يمكثوا حتى يستعدّوا للمرحلة التالية؛ فأمامهم صحراء واسعة يندر فيها الماء».'},
       {q:'ب- تشبيه ابن بطوطة مكانة الملح في بلاد السودان بمكانة «الذهب والفضة» يكشف عن:',o:['قيمته الاقتصادية العالية واستعماله في بعض المبادلات.','تطابق لون ألواح الملح مع لمعان الذهب والفضة.','رغبة التجّار في خداع سكان الجنوب بسلعة زهيدة.','غنى سكان تغازى وامتلاكهم ثروات هائلة من المعادن النفيسة.'],c:0,w:'كان أهل السودان يقطعون الملح قطعًا ويتعاملون به في مبادلاتهم.'}],
  open:[['ج- «وكلما ابتعد الملح عن معدنه ارتفع ثمنه». ما الذي تستنتجه عن العوامل التي كانت تتحكم في قيمة السلع؟','تتحكّم في قيمتها: بُعد المسافة عن مصدرها، وصعوبة النقل ومشقّته عبر الصحراء، وندرة السلعة في مكان البيع وحاجة الناس إليها.'],
        ['3. كيف حوّلت التجارة «تغازى» القاحلة إلى عقدة وصل حيوية بين شمال إفريقيا وجنوبها؟','بفضل موقعها على طريق تجاري طويل بين شمال الصحراء وجنوبها، وثروة الملح التي يحتاجها الجميع: تصلها المؤن من سجلماسة ودرعة وبلاد السودان، ويخرج منها الملح على ظهور الجمال، فصارت محطة تلتقي فيها القوافل وتتبادل السلع.'],
        ['4. نقل ابن بطوطة جوانب المعاناة بجانب عجائب العمران وحركة التجارة. ما رأيك في موضوعيته وأمانته العلمية؟','كان موضوعيًّا أمينًا: لم يكتفِ بوصف العجائب المدهشة (بيوت الملح)، بل ذكر الصعوبات أيضًا (الماء الشديد الملوحة، كثرة الذباب، الإقامة الشاقّة)، فنقل الصورة كاملة دون تجميل ولا مبالغة.'],
        ['5. يختم النص بأن الصحراء كانت «طريقًا تتلاقى فيه حاجات الناس من بلاد متباعدة». كيف يدحض هذا القول فكرة أن الصحراء عائق يعزل الشعوب؟','يبيّن النص أن الصحراء لم تفصل الناس، بل ربطتهم: فالقوافل كانت تعبرها حاملةً التمر والذرة والجلود من الشمال، والذهب من الجنوب، وتلتقي في تغازى لتتبادل الملح؛ فصارت الصحراء جسرًا للتجارة والتواصل.']],
  model:'كيف تحوّلت قرية قاحلة إلى سوق للقوافل؟ تقع تغازى في قلب الصحراء، أرضها خالية من الشجر، وماؤها شديد الملوحة، وغذاؤها شحيح. لكنّ في باطنها ثروة ثمينة هي الملح، الذي يستخرجه العمّال ألواحًا ضخمة، حتى إنهم يبنون منه بيوتهم. وبما أنّ تغازى تقع على الطريق التجاري بين سجلماسة وبلاد السودان، صارت القوافل تحمل إليها التمر والذرة واللحوم، ثمّ تعود محمّلة بألواح الملح على ظهور الجمال. ولأن الملح نادر في الجنوب، كان يُباع بأضعاف ثمنه، بل يُتعامل به كالذهب والفضة. وهكذا جمعت تغازى بين موقع مناسب ومورد نادر، فتحوّلت من أرض قاسية إلى محطة يلتقي فيها المسافرون ويتبادلون السلع.'},

{ t:'كيف قاس العلماء محيط الأرض؟', s:'الحصتان 15 و 16', src:'قدري حافظ طوقان، «تراث العرب العلمي في الرياضيات والفلك»، بتصرف',
  sum:'لاحظ إراتوستينس أن أشعة الشمس تسقط عمودية في أسوان يوم الانقلاب الصيفي، بينما يبقى للأعمدة ظلّ مائل في الإسكندرية؛ فقارن وقدّر محيط الأرض. وفي عهد المأمون، قاس العلماء في صحراء سنجار درجة واحدة من خطوط الزوال بالحبال والأوتاد ورصد النجوم، بجهد كبير. أما البيروني فقاس ارتفاع جبل قرب قلعة ناندنا وزاوية انخفاض الأفق من قمّته بالأسطرلاب، وحسب محيط الأرض بمعادلة رياضية فقدّره بنحو 40 ألف كيلومتر، وهو قريب جدًّا من القياسات الحديثة.',
  vocab:{q:'أصنّف المفردات حسب المجال الذي تنتمي إليه', head:['المجال','المفردات'], rows:[['ظواهر وملاحظات','الظلّ – الأفق'],['أدوات قياس','الأسطرلاب – حبال المسح'],['عمليات علمية','الرصد – القياس'],['مقادير رياضية','محيط الأرض – نصف قطر الأرض']]},
  mcq:[{q:'أ- ما الظاهرة التي اعتمد عليها إراتوستينس لحساب محيط الأرض؟',o:['رصد مواقع النجوم ليلًا في صحراء سنجار الواسعة.','اختلاف زاوية سقوط الشمس بين أسوان (انعدام الظل) والإسكندرية (وجود ظلّ مائل).','قياس زاوية انخفاض الأفق من أعلى قمّة جبل ناندنا.','تحديد حركة أمواج البحر وارتباطها بكروية الكوكب.'],c:1,w:'قارن بين وجود الظل في الشمال وغيابه في الجنوب في اللحظة نفسها.'},
       {q:'ب- لجوء البيروني إلى قمة الجبل واستعمال الهندسة بدل المسح الصحراوي يكشف عن:',o:['تفضيل العلماء الراحة وتجنّب مشاقّ الأسفار البعيدة.','عدم دقّة النتائج التي توصّل إليها علماء المأمون.','قدرة الذكاء الرياضي والفكر النظري على اختصار الجهد البدني الشاق.','رغبته في اختبار صلاحية جهاز الأسطرلاب فوق المرتفعات.'],c:2,w:'النص: «أدرك البيروني أن هذا الموضع يمنحه حلًّا سحريًّا… عملية عقلية ذكية… تجنّب الإنسان قطع مئات الأميال».'}],
  open:[['ج- ماذا تستنتج من تتابع محاولات قياس الأرض حول طبيعة المعرفة العلمية وتطوّرها عبر الأجيال؟','المعرفة العلمية تراكمية: كل جيل يبني على جهود من سبقه، وتزداد النتائج دقّة كلما تطوّرت أدوات القياس وأساليب الرياضيات، وتتعاون فيها عقول من حضارات مختلفة.'],
        ['3. قارن بين طريقة علماء المأمون في صحراء سنجار وطريقة البيروني في جبل ناندنا (الوسائل والجهد).','الوسائل: علماء المأمون استعملوا حبال المسح والأوتاد ورصد النجوم، بينما استعمل البيروني الأسطرلاب ومعادلة رياضية. الجهد: علماء المأمون مشوا أيامًا طويلة يجرّون الحبال بجهد بدني كبير وبمشاركة كثيرين، في حين اكتفى البيروني بقياس زاويتين من قمّة جبل وحساب ذكي، فاختصر الجهد كثيرًا.'],
        ['4. لماذا يُعدّ حساب البيروني (40 ألف كلم) إنجازًا مبهرًا رغم بساطة أدواته مقارنة بالتكنولوجيا الحديثة؟','لأن نتيجته تقارب جدًّا ما توصّلت إليه الأقمار الاصطناعية اليوم، وقد بلغها بأسطرلاب صنعه بيده وبعقله الرياضي فقط، دون أجهزة متطوّرة؛ فهو دليل على قوة التفكير العلمي.'],
        ['5. كيف تتكامل العلوم (الفلك، الرياضيات، الجغرافيا) في خدمة حضارة الإنسان؟','الفلك يرصد الشمس والنجوم ويحدّد الزوايا، والرياضيات تحوّل هذه الأرصاد إلى حسابات دقيقة لأبعاد الأرض، والجغرافيا تستعمل هذه الأبعاد لرسم الخرائط وتقسيم العالم إلى أقاليم كما فعل الإدريسي؛ فتخدم كلها التنقّل والتجارة ومعرفة العالم.']],
  model:'تقرير: ثلاث طرق لقياس الأرض\nحاول العلماء عبر التاريخ معرفة محيط الأرض، فسلك كلّ منهم طريقًا مختلفًا. اعتمد إراتوستينس على ملاحظة ذكية للظلّ: فبينما انعدم الظل في أسوان، كان مائلًا في الإسكندرية، فقدّر المحيط بالمقارنة. أما علماء المأمون، فقد بذلوا جهدًا بدنيًّا كبيرًا؛ إذ ساروا أيامًا في صحراء سنجار يجرّون حبال المسح ويغرزون الأوتاد ويرصدون النجوم. وعلى خلافهم، صعد البيروني وحده إلى قمة جبل ناندنا، وقاس بأسطرلابه زاوية انخفاض الأفق، ثم حسب المحيط بمعادلة رياضية، فبلغ نتيجة دقيقة جدًّا. نستنتج أن تطوّر الرياضيات والقياس جعل العلم أدقّ وأقلّ مشقّة، وأن العقل يختصر ما يعجز عنه الجهد.'},

{ t:'الإدريسي: حين اجتمع العالم على خريطة', s:'الحصتان 17 و 18', src:'زكي محمد حسن، «الرحالة المسلمون في العصور الوسطى»، فصل «الإدريسي»، بتصرف',
  sum:'وُلد الشريف الإدريسي في سبتة سنة 1100م، ودرس الفلك والهندسة في قرطبة، ثم رحل في المغرب والأندلس وفرنسا وإنجلترا وآسيا الصغرى. استدعاه الملك روجار الثاني إلى صقلية لوضع موسوعة جغرافية، فاستجوب التجار والرحالة، وأرسل بعثات استطلاعية، ولم يدوّن إلا ما تأكّد منه. عمل نحو خمسة عشر عامًا، وصنع كرة فضية هائلة نقش عليها البلدان والأنهار، وألّف كتاب «نزهة المشتاق» سنة 1154م، وجعل الجنوب في أعلى خريطته على عادة رسامي الخرائط المسلمين.',
  vocab:{q:'أستعين بسياق النص لإكمال خريطة كلمة «تبحّر»', head:['الركن','الجواب'], rows:[['نوعها','فعل ماضٍ'],['مرادفها','تعمّق (توسّع في العلم)'],['ضدّها','اكتفى بالقشور / سطّح'],['تركيبها في جملة مفيدة','تبحّرَ الإدريسي في كتب الجغرافيا القديمة قبل أن يرسم خريطته.']]},
  mcq:[{q:'أ- ما المنهج الذي اعتمده الإدريسي للتأكد من صحة المعلومات الجغرافية؟',o:['استجواب الرحالة والموازنة بين شهاداتهم مع إرسال بعثات استطلاعية ميدانية.','الاكتفاء بنسخ ما جاء في خرائط اليونان القديمة دون تعديل.','الاعتماد الكلّي على رحلات التجار في البحر المتوسط فقط.','تخيّل مواقع البلدان النائية اعتمادًا على الأساطير البحرية الشائعة.'],c:0,w:'«كان يستقبل التجار والرحالة… ويوازن بين شهاداتهم… ويرسل بعثات استطلاعية».'},
       {q:'ب- جعل الإدريسي جهة «الجنوب في الأعلى» عند رسم خريطته يكشف عن:',o:['ارتكابه خطأ هندسيًّا غير مقصود أثناء نقش الكرة الفضية.','جهل البحّارة في ذلك العصر بالاتجاهات الأصلية للكوكب.','اتّباعه عُرفًا علميًّا وتقليدًا سائدًا لدى رسّامي الخرائط المسلمين في عصره.','رغبته في تمييز موانئ صقلية عن باقي موانئ البحر المتوسط.'],c:2,w:'«جعل فيها الجنوب في الأعلى جريًا على عادة رسّامي الخرائط المسلمين».'}],
  open:[['ج- ماذا تستنتج من تعاون الملك روجار والإدريسي عن دور تبادل المعرفة بين الشعوب؟','أن المعرفة تزدهر حين تتعاون الشعوب والحضارات وتتبادل خبراتها رغم اختلافها، وأن دعم الحكّام للعلماء يُنتج أعمالًا عظيمة تخدم الإنسانية كلها.'],
        ['3. كيف تدرّج الإدريسي في بناء معرفته الجغرافية من الدراسة النظرية إلى الممارسة الميدانية، ثم إلى التأليف والصناعة؟','بدأ بالدراسة النظرية للفلك والهندسة وكتب الأقدمين في قرطبة، ثم انتقل إلى الممارسة فرحل في بلدان كثيرة يشاهد ويدوّن، ثم جمع شهادات الرحالة وتثبّت منها، وأخيرًا ألّف كتاب «نزهة المشتاق» وصنع الكرة الفضية.'],
        ['4. استغرق إعداد الخريطة والكتاب نحو 15 عامًا. ما رأيك في هذا الجهد؟ وما القيمة التي يعلّمنا إياها عن «الأمانة العلمية والصبر»؟','جهد عظيم يدلّ على الإخلاص والجدّية. ويعلّمنا أن الأمانة العلمية تعني ألّا ندوّن إلا ما تأكّدنا منه، وأن العمل المتقن يحتاج صبرًا طويلًا ولا يُنجز على عجل.'],
        ['5. «إنّ المعرفة بناءٌ يكتمل حين تلتقي العقول». كيف يُجسّد عمل الإدريسي هذه الفكرة؟','جمع الإدريسي بين حسابات الفلك، وشهادات الرحالة والتجار، ومعارف الأقدمين، وتقارير البعثات، بدعم من الملك روجار؛ فاجتمعت عقول كثيرة من شعوب مختلفة لتُخرج خريطة واحدة دقيقة.']],
  model:'الشريف الإدريسي: عالم مغربي جمع العالم على خريطة\nوُلد الإدريسي في مدينة سبتة المغربية سنة 1100م، ودرس الفلك والهندسة في قرطبة، ثم رحل إلى بلدان كثيرة يشاهد ويدوّن. استدعاه ملك صقلية روجار الثاني ليضع موسوعة جغرافية، فلم يكتفِ بالكتب القديمة، بل استجوب التجار والرحالة، وقارن بين أقوالهم، وأرسل بعثات للتثبّت، ولم يكتب إلا ما تأكّد منه. وبعد نحو خمسة عشر عامًا من العمل، صنع كرة فضية هائلة نقش عليها البلدان والأنهار، وألّف كتاب «نزهة المشتاق في اختراق الآفاق»، فصارت خريطته مرجعًا لقرون. إننا نفخر بهذا العالم المغربي الذي أسهم بصبره وأمانته في بناء الحضارة الإنسانية.'},

{ t:'نبض الأرض', s:'الحصتان 19 و 20', src:'بيل ماجواير، «الكوارث العالمية: مقدمة قصيرة جدًّا»، بتصرف',
  sum:'يبدو البركان جبلًا هادئًا، لكنّ في أعماقه صخورًا تذوب بالحرارة والضغط فتصير صهارة ممزوجة بغازات، تصعد لأنها أخفّ. يتراكم الضغط تحت الجبل حتى يثور: إذا كانت الصهارة سائلة سالت حممًا هادئة، وإذا كانت لزجة انفجر الجبل وقذف الرماد. يرصد العلماء الاهتزازات وانتفاخ السفوح والغازات لإنذار السكان. وبعد الثوران يتحوّل الرماد إلى تربة خصبة. ويميّز العلماء بين البركان الخامد والمنقرض بدراسة أعمار الصخور.',
  vocab:{q:'أملأ أركان النموذج لتحديد المفهوم العلمي لكلمة «الصهارة»', head:['الركن','الجواب'], rows:[['التعريف كما أفهمه من النص','صخور ذابت في أعماق الأرض بفعل الحرارة والضغط، وامتزجت بغازات محبوسة'],['الخصائص والمميزات','منصهرة، أخفّ وزنًا من الصخور حولها فتصعد، تحمل غازات، قد تكون سائلة أو لزجة'],['مثال دالّ من النص','الحمم المتوهّجة التي تسيل على السفوح'],['مثال غير دالّ (ما ليس صهارة)','الصخور الصلبة في القشرة الأرضية، أو الرماد البارد']]},
  mcq:[{q:'أ- ما الذي يتحكّم في طبيعة ثوران البركان (انسيابي هادئ أو انفجاري صاعق)؟',o:['ارتفاع الجبل وكمية الأمطار التي تهطل على سفوحه.','قرب الجبل البركاني من مياه البحر أو المحيط.','سرعة الرياح التي تمرّ فوق الفوهة البركانية.','درجة سيولة الصهارة أو لزوجتها ومقدار الغازات المحبوسة فيها.'],c:3,w:'«تحدّد طبيعة الصهارة ملامح هذا الحدث: سائلة… أو لزجة كثيفة تحتجز الغازات».'},
       {q:'ب- إقبال السكان على العيش قرب البراكين رغم مخاطرها يكشف عن:',o:['تفضيلهم الاستفادة من التربة البركانية الخصبة رغم علمهم بالخطر.','عدم قدرة الأجهزة العلمية على تنبيههم قبل الانفجار.','اعتقاد الناس أن جميع البراكين منقرضة ولن تثور أبدًا.','رغبتهم في مشاهدة الحمم المتوهّجة والتمتّع بمنظر السفوح.'],c:0,w:'الرماد يتحوّل إلى تربة خصبة تكسو السفوح خضرة، فيستفيد منها السكان في الزراعة.'}],
  open:[['ج- ماذا تستنتج من عدم اكتفاء الباحثين بمنظر الجبل الخارجي للتفريق بين البركان الخامد والمنقرض؟','أن المظهر الخارجي الهادئ قد يكون خادعًا، فلا يُحكم على البركان من شكله، بل بالدراسة العلمية: أعمار الصخور وتاريخ ثوراته القديمة.'],
        ['3. قارن بين «الصهارة» و«اللابة» (الحمم) من حيث موقع كلّ منهما والفرق عند الخروج إلى السطح.','الصهارة توجد في أعماق الأرض تحت الجبل، ممزوجة بالغازات المحبوسة. فإذا خرجت إلى السطح صارت لابة (حممًا) تسيل على السفوح، وتنفلت منها الغازات.'],
        ['4. يُنظر إلى البركان عادة كارثة مدمّرة، لكنّ النص يُبرز له جانبًا إيجابيًّا. ما رأيك؟ وكيف يمكن أن تكون النار مصدرًا للخصب؟','رأيي أن للبركان وجهين: يهدم ويبني. فالرماد الذي يقذفه يختلط بالأرض ويتحوّل مع السنين إلى تربة غنية بالمعادن، تكسو السفوح بالنباتات وتصلح للزراعة؛ فتصير النار مصدرًا للخصب.'],
        ['5. فسّر كيف تبرهن ظاهرة «انتفاخ سفوح الجبل» على أن الكوكب كائن دائم الحركة والتجدّد.','انتفاخ السفوح يعني أن الصهارة تصعد وتتراكم تحت الجبل فتدفع الأرض إلى الأعلى؛ أي أن باطن الأرض يتحرّك باستمرار، وتتشكّل بفعله تضاريس جديدة وتربة جديدة، فالأرض «حيّة» تتجدّد.']],
  model:'البركان… هل هو نائم أم هادئ؟\nأعزّائي التلاميذ، صباح الخير! هل تعلمون أن الجبل الهادئ قد يُخفي نارًا في أعماقه؟ تحت البركان، تذوب الصخور بفعل الحرارة والضغط فتصير صهارة تحمل غازات، ولأنها أخفّ من الصخور حولها، فإنها تصعد شيئًا فشيئًا. وحين يتراكم الضغط، قد يثور البركان: إمّا بحمم تسيل بهدوء، وإمّا بانفجار يقذف الرماد. لذلك يرصد العلماء البراكين بأجهزة حسّاسة، فيتابعون الاهتزازات، وانتفاخ السفوح، وتصاعد الغازات، لينذروا السكان في الوقت المناسب. فلا داعي للخوف، بل للاستعداد: لنتعرّف خرائط الإخلاء، ولنتّبع تعليمات العلماء والسلطات. فالمعرفة والحذر يحمياننا، والطبيعة تعطي بقدر ما نحترمها.'},

{ t:'المصنع الأخضر', s:'الحصتان 21 و 22', src:'تيموثي ووكر، «عالم النبات: مقدمة قصيرة جدًّا»، بتصرف',
  sum:'تصنع أوراق النبات غذاءها في عملية «البناء الضوئي»: يدخل غاز ثاني أكسيد الكربون من مسامّ الورقة، ويصعد الماء والأملاح من الجذور، وتلتقط صبغة اليخضور في البلاستيدات ضوء الشمس، فيُصنع سكر الجلوكوز ويُطلق الأكسجين. يتوزّع السكر على أجزاء النبات ويُخزّن الفائض نشًا. وتجربة اليود تُثبت أن الضوء ضروري لصنع الغذاء. والنبات يتنفّس ليلًا ونهارًا، لكنه يُطلق نهارًا أكسجين أكثر مما يستهلك. والنباتات أساس السلسلة الغذائية.',
  vocab:{q:'أستخرج من النص الكلمات التي تنتمي إلى المجال العلمي لعملية «البناء الضوئي»', head:['العنصر','مفردته من النص'], rows:[['عُضيّة خلويّة','البلاستيدات الخضراء'],['صبغة لاقطة','اليخضور (الكلوروفيل)'],['مادة ناتجة (غذاء)','السكر (الجلوكوز)'],['غاز منبعث','الأكسجين']]},
  mcq:[{q:'أ- كيف تتصرّف النبتة في فائض السكر الذي تصنعه أثناء النهار؟',o:['تتخلّص منه مباشرة عبر المسامّ المجهرية إلى الهواء.','تحرقه كلّه فورًا لتدفئة الساق والأوراق من البرد.','تخزّنه في صورة نشا لتستعمله عند غياب الضوء والحاجة إلى النموّ.','تنقله إلى الهواء مع غاز ثاني أكسيد الكربون.'],c:2,w:'«أما الفائض فيُخزَّن على هيئة نشا يدّخره النبات لأيام الغيم والشتاء».'},
       {q:'ب- تحوّل أوراق الأشجار إلى اللونين الأصفر والأحمر في الخريف يدلّ على أنّ:',o:['الأوراق اكتسبت أصباغًا جديدة هبطت عليها من الهواء البارد.','جذور الشجرة توقّفت تمامًا عن امتصاص الماء والأملاح.','النبتة أوقفت عملية التنفّس الخلوي بشكل نهائي.','هذه الألوان كانت موجودة بالفعل لكنّ كثافة اليخضور كانت تحجبها.'],c:3,w:'«تتفكّك اليخضور فتظهر تلك الألوان الذهبية التي كانت مختبئة طوال أيام الدفء».'}],
  open:[['ج- «يطلق النبات في وضح النهار كمّيات من الأكسجين تزيد بكثير عمّا يستهلكه في تنفّسه». ماذا تستنتج حول دور الغابات في حفظ التوازن البيئي؟','الغابات مصدر رئيسي للأكسجين الذي تتنفّسه الكائنات، وهي تمتصّ ثاني أكسيد الكربون من الهواء؛ فتحفظ توازن غازات الجوّ، ولهذا تُسمّى «رئة الأرض».'],
        ['3. لماذا تلوّن الجزء المعرّض للشمس بالأزرق الداكن عند إضافة اليود، بينما بقي الجزء المحجوب شاحبًا؟ وما الذي يثبته ذلك؟','لأن الجزء المعرّض للضوء صنع غذاءً خزّنه نشًا، واليود يتلوّن بالأزرق مع النشا. أما الجزء المحجوب فلم يصنع غذاءً لغياب الضوء. وهذا يُثبت أن الضوء ضروري لعملية البناء الضوئي.'],
        ['4. يتخوّف بعض الناس من وضع النباتات في غرف النوم مدّعين أنها «تخنق الإنسان ليلًا». قيّم هذا الادعاء.','ادعاء مبالغ فيه: صحيح أن النبات يتنفّس ليلًا فيستهلك قليلًا من الأكسجين، لكنّ هذه الكمية صغيرة جدًّا ولا تخنق أحدًا، وفي النهار يُطلق النبات أكسجين أكثر بكثير مما يستهلك.'],
        ['5. بيّن كيف تنتقل «طاقة الشمس» من الفضاء لتصل إلى جسد الإنسان عبر السلسلة الغذائية.','تلتقط الورقة ضوء الشمس وتحوّله إلى غذاء (سكر) مخزّن في النبات ← يأكل الحيوان العاشب النبات فتنتقل إليه الطاقة ← يأكل الإنسان النبات أو الحيوان، فتصل طاقة الشمس في النهاية إلى جسمه.']],
  model:'الرئة التي لا تتوقّف\nهل فكّرت يومًا من أين يأتي الأكسجين الذي تتنفّسه؟ إنه هديّة من الأوراق الخضراء! ففي كل ورقة مصنع صغير يُسمّى البناء الضوئي: تلتقط صبغة اليخضور ضوء الشمس، ويدخل غاز ثاني أكسيد الكربون من المسامّ، ويصعد الماء من الجذور، فيُصنع السكر غذاءً للنبات. ونتيجةً لذلك، يُطلق النبات الأكسجين في الهواء. ولأنّ الحيوانات والإنسان يأكلون النبات أو يأكلون ما يأكله، فإن الغطاء النباتي أساس حياة الكائنات جميعًا. لكنّ قطع الأشجار وتقليص المساحات الخضراء يُفقدان الأرض رئتها، فيزداد تلوّث الهواء وتختلّ الحياة. لذلك، لنحمِ أشجارنا، ولنغرس في مدارسنا وأحيائنا شجرةً جديدة كل عام.'},

{ t:'كيف يرى الروبوت طريقه؟', s:'الحصتان 23 و 24', src:'آلان وينفيلد، «الروبوتات: مقدمة قصيرة جدًّا»، بتصرف',
  sum:'لا يرى الروبوت كما نرى، بل هو نظام هندسي: المستشعرات (كاميرات، ليزر، موجات صوتية) تلتقط معلومات المحيط، والبرنامج يحوّلها إلى أرقام ويتّخذ القرار، والمشغّلات تحوّل القرار إلى حركة، والتغذية الراجعة تراقب الحركة وتصحّحها. وإذا نقصت المعلومات توقّف الروبوت، لأن قاعدته «السلامة أولًا»؛ فالذكاء الحقيقي للآلة في دقّة التوقف في الوقت المناسب. ويختم الكاتب بأن أعظم عقل على الكوكب سيظلّ عقل الإنسان الذي ابتكر الروبوت.',
  vocab:{q:'أربط كل مصطلح بوظيفته داخل الروبوت', head:['المصطلح','وظيفته'], rows:[['المستشعرات','التقاط معلومات المحيط (الصور، الأبعاد، الأصوات) وإرسالها إلى البرنامج'],['البرنامج','ترجمة الإشارات إلى حسابات رقمية واتخاذ القرار المناسب'],['المشغّلات','تحويل القرارات إلى حركة فعلية (دوران العجلات، تحريك الذراع)'],['التغذية الراجعة','مراقبة الحركة باستمرار وتصحيح أي انحراف فورًا']]},
  mcq:[{q:'أ- ما الدور الأساسي الذي تقوم به «المشغّلات» داخل الروبوت؟',o:['تحويل القرارات والأوامر الرقمية إلى حركة ميكانيكية فعلية.','التقاط الصور الرقمية ومسح الأبعاد بالليزر.','رسم الخرائط الجديدة للأماكن الغريبة.','قياس زمن ارتداد الموجات الصوتية غير المسموعة.'],c:0,w:'«يدفع به إلى المشغّلات؛ وهي المحرّكات الصغيرة… التي تُدير العجلات أو تمدّ الذراع».'},
       {q:'ب- لماذا يزوّد المهندسون الروبوت بأكثر من مصدر للمعلومات؟',o:['لزيادة سرعة حركته.','لجعل شكله أكثر تعقيدًا.','لأن بعض المستشعرات قد تُخطئ، فيساعد تعدّدها على دقّة التقدير والسلامة.','لكي يستغني تمامًا عن الإنسان.'],c:2,w:'الضوء الخافت والغبار قد يُعطّلان مستشعرًا، فتعوّضه المستشعرات الأخرى.'}],
  open:[['ج- «الذكاء الحقيقي للآلة يكمن في دقّة التوقّف في الوقت المناسب». ماذا تستنتج حول مفهوم «الأمان» في عصر التكنولوجيا الحديثة؟','أن الأمان أهمّ من السرعة: الآلة الجيدة هي التي تتوقّف حين لا تتأكّد، بدل أن تتقدّم فتؤذي الناس؛ فالسلامة يجب أن تكون الأولوية الأولى في كل تكنولوجيا.'],
        ['3. قارن بين «رؤية الإنسان» للطريق و«رؤية الروبوت»، موضّحًا كيف تعوّض الأرقام والمستشعرات دور الحواس البشرية.','الإنسان يرى بعينيه ويفهم ما يرى فورًا. أما الروبوت فلا يرى ولا يفهم، بل تلتقط كاميراته وليزره وموجاته الصوتية إشارات يحوّلها البرنامج إلى أرقام وإحداثيات (مسافات وزوايا)، فيقارنها ويحسب طريقه؛ فالقياس الدقيق يعوّض الحواس.'],
        ['4. لماذا لا يُعدّ توقّف الروبوت عند نقص المعلومات فشلًا في أدائه، بل قد يكون قرارًا ذكيًّا؟','لأنه يعمل بقاعدة «السلامة أولًا»: التقدّم بمعلومات ناقصة قد يؤدّي إلى اصطدام أو أذى، فيتوقّف إلى أن تتّضح الرؤية. والنص يقول إن الذكاء الحقيقي في دقّة التوقّف في الوقت المناسب.'],
        ['5. «إنّ أعظم عقل على هذا الكوكب سيظلّ عقل الإنسان الذي ابتكره». هل هذه العبارة حقيقة علمية أم موقف يعبّر عنه الكاتب؟','هي موقف ورأي يعبّر عنه الكاتب، يقوم على حقيقة أن الإنسان هو من صمّم الروبوت وبرمجه، فالروبوت ينفّذ ما خطّه له صانعوه. لكنها ليست حقيقة علمية مُثبتة بتجربة.']],
  model:'يرى زميلي أن الروبوت يشبه الإنسان لأنه يستشعر ويختار ويصحّح أخطاءه، لكنني أخالفه الرأي. صحيح أن الروبوت يلتقط بمستشعراته الصور والمسافات، ويتّخذ قرارات، ويصحّح حركته بالتغذية الراجعة، غير أنه لا يفهم ما يفعل. فالكاميرا لا «ترى»، بل تحوّل ما تلتقطه إلى أرقام يقارنها البرنامج بقواعد كتبها المهندسون. والدليل على ذلك أن الروبوت يتوقّف إذا نقصت معلوماته، لأنه لا يستطيع أن يتخيّل أو يستنتج كما يفعل الإنسان. أما الإنسان فيفهم، ويشعر، ويبتكر حلولًا لم يتعلّمها من قبل. إضافة إلى ذلك، فالإنسان هو الذي صمّم الروبوت وبرمجه. لذلك أرى أن الروبوت آلة ذكية في التنفيذ، لكنّ الفهم الحقيقي يبقى للعقل البشري الذي ابتكره.'}
];

const $=s=>document.getElementById(s);
let cur=0, teacher=false;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function sec(n,title){const c=el('section','card');const h=el('h3');if(n){h.append(el('span','n',n))}h.append(document.createTextNode(title));c.append(h);return c}

function renderPicker(){
  $('picker').innerHTML='';
  LESSONS.forEach((l,i)=>{const b=el('button','chip');b.type='button';b.setAttribute('aria-pressed',i===cur);
    b.append(el('b',null,String(i+1)),el('span',null,l.t));b.onclick=()=>go(i);$('picker').append(b)});
}
function go(i){cur=i;store.set('ans-cur',i);render();renderPicker();window.scrollTo({top:0,behavior:'auto'})}

function render(){
  const L=LESSONS[cur],m=$('lesson');m.innerHTML='';
  // header card
  const c=el('section','card');const meta=el('div','meta');meta.append(el('span','tag',L.s),el('span','tag',`الدرس ${cur+1} من 12`));
  c.append(meta,el('h2',null,L.t),el('p','sum',L.sum),el('p','src','المصدر: '+L.src));
  c.append(el('p','note','هذا ملخص النص، لأن النصوص مأخوذة من كتب محمية بحقوق النشر. النص الكامل موجود في كراسة التلميذ.'));
  m.append(c);
  // vocab
  const v=sec('1','أُغني معجمي');v.append(el('p','q',L.vocab.q));
  const tw=el('div','tbl'),t=el('table');const head=L.vocab.head||['الكلمة','معناها'];
  const tr=el('tr');head.forEach(h=>tr.append(el('th',null,h)));t.append(tr);
  L.vocab.rows.forEach(r=>{const row=el('tr');r.forEach((x,j)=>{const td=el('td',j===0?'k':'ans');if(j===0)td.textContent=x;else{const s=el('span','ans-v',x);s.title='اضغط لإظهار الجواب';s.onclick=()=>td.classList.remove('hid');td.append(s);if(!teacher)td.classList.add('hid')}row.append(td)});t.append(row)});
  tw.append(t);v.append(tw);if(L.vocab.note)v.append(el('p','note',L.vocab.note));
  if(!teacher)v.append(el('p','note','حاول أولًا، ثم اضغط على الجواب المموّه لتراه.'));
  m.append(v);
  // understanding
  const u=sec('2','أفهم وأستنتج');const sc=el('p','score');u.append(sc);let got=0,done=0;
  const upd=()=>{sc.textContent=done?`أجبتَ عن ${done} من ${L.mcq.length} أسئلة اختيار، الصحيح منها ${got}.`:'اختر الجواب الصحيح، وستظهر لك النتيجة فورًا.'};upd();
  L.mcq.forEach(q=>{const box=el('div','list');box.append(el('p','q',q.q));const ul=el('ul','opts');const why=el('p','why','✓ '+q.w);why.hidden=true;let answered=false;
    q.o.forEach((o,k)=>{const li=el('li'),b=el('button','opt');b.type='button';const bx=el('span','box');b.append(bx,el('span',null,o));
      b.onclick=()=>{if(answered)return;answered=true;done++;if(k===q.c)got++;upd();
        [...ul.querySelectorAll('.opt')].forEach((x,j)=>{if(j===q.c){x.classList.add('right');x.querySelector('.box').textContent='✓'}else if(j===k){x.classList.add('wrong');x.querySelector('.box').textContent='✗'}});why.hidden=false};
      li.append(b);ul.append(li)});
    if(teacher){answered=true;const x=ul.children[q.c].firstChild;x.classList.add('right');x.querySelector('.box').textContent='✓';why.hidden=false}
    box.append(ul,why);u.append(box)});
  const firstOpen=L.open.filter(o=>!/^\d/.test(o[0]));firstOpen.forEach(o=>u.append(det(o)));
  m.append(u);
  // 3-5
  const r=sec('3–5','أتفاعل مع النص: أسئلة التفكير');L.open.filter(o=>/^\d/.test(o[0])).forEach(o=>r.append(det(o)));
  r.append(el('p','note','الأجوبة نماذج: يُقبل كل جواب صحيح بصياغة التلميذ، خاصة في أسئلة الرأي إذا كان معلّلًا.'));
  m.append(r);
  // model writing
  const w=sec('6','أبدع في الكتابة: نموذج إنتاج كتابي');
  const d=el('details');if(teacher)d.open=true;const s=el('summary',null,'نموذج مقترح للإنتاج الكتابي (يُقرأ بعد أن يكتب التلميذ نصّه)');const p=el('p','model',L.model);p.style.color='var(--ink)';d.append(s,p);w.append(d);
  m.append(w);
  $('prev').disabled=cur===0;$('next').disabled=cur===LESSONS.length-1;
}
function det([q,a]){const d=el('details');if(teacher)d.open=true;d.append(el('summary',null,q),el('p',null,a));return d}
$('prev').onclick=()=>cur>0&&go(cur-1);$('next').onclick=()=>cur<LESSONS.length-1&&go(cur+1);
$('teacher').onclick=()=>{teacher=!teacher;$('teacher').setAttribute('aria-pressed',teacher);render()};
cur=Math.min(11,Math.max(0,parseInt(store.get('ans-cur')||'0',10)||0));
renderPicker();render();
</script>
